<div class="cont">
    <div class="cont_nav">
        <div class="nav">
            <div class="cont_boton_nav">
                <button (click)="menu()">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-square-rounded-check"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M9 12l2 2l4 -4" /><path d="M12 3c7.2 0 9 1.8 9 9c0 7.2 -1.8 9 -9 9c-7.2 0 -9 -1.8 -9 -9c0 -7.2 1.8 -9 9 -9" /></svg>
                </button>
            </div>
        </div>
        <div class="cont_menu" *ngIf="estado_menu">
                <div class="menu" >
                    
                    <div class="menu_titulo">
                        <p>configuracion de visualizacion</p>
                        <div class="cont_menu_boton">
                            <button class="button_cerrar" (click)="menu()">X</button>
                        </div>
                    </div>
                    <div class="cont_filas">
                        <div class="fila" *ngFor="let f of fila">
                            <div class="cont_texto">
                                <p>{{f.texto}}</p>
                            </div>
                            <div class="cont_boton">
                                <button (click)="visualizar(f)">
                                <svg *ngIf="f.visualizar" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-eye"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M10 12a2 2 0 1 0 4 0a2 2 0 0 0 -4 0" /><path d="M21 12c-2.4 4 -5.4 6 -9 6c-3.6 0 -6.6 -2 -9 -6c2.4 -4 5.4 -6 9 -6c3.6 0 6.6 2 9 6" /></svg>
                                <svg *ngIf="!f.visualizar" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-eye-off"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M10.585 10.587a2 2 0 0 0 2.829 2.828" /><path d="M16.681 16.673a8.717 8.717 0 0 1 -4.681 1.327c-3.6 0 -6.6 -2 -9 -6c1.272 -2.12 2.712 -3.678 4.32 -4.674m2.86 -1.146a9.055 9.055 0 0 1 1.82 -.18c3.6 0 6.6 2 9 6c-.666 1.11 -1.379 2.067 -2.138 2.87" /><path d="M3 3l18 18" /></svg>
                            </button>
                            </div>
                            
                        </div>
                    </div>
                    
                </div>
            </div>
    </div>
    <div class="cont_info">
        <ng-container *ngFor="let i of info_tarjeta">
            <div class="cont_tarjetas" *ngIf="i.visualizar">
            <div class="tarjeta">
                <p class="titulo">{{ i.texto }}</p>
                <p class="valor">
                    <span *ngIf="
    i.texto == 'valor total stock' ||
    i.texto == 'ingreso mes valor' ||
    i.texto == 'ventas mes valor'
">$</span>
                    {{ i.valor }}</p>
            </div>
            </div>
        </ng-container>
    </div>
</div>
